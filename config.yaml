run:
  data_source: yahoo
  csv_dir: data/csv
  cache_dir: data/cache
  output_dir: output
  benchmark: ^NSEI
  universe_file: universe/ind_nifty500list.csv
  max_symbols: null
  strategy_spec: specs/RECOMMENDED.json
backtest:
  start: '2021-01-01'
  end: null
  warmup_days: 420
  rebalance_every: 5
  top_n: 20
  horizons:
  - 5
  - 10
  - 20
  max_hold_days: 20
  cost_pct: 0.0025
  skip_if_open: true
  periods:
  - name: 2021-2023 in-sample
    start: '2021-01-01'
    end: '2023-12-31'
  - name: 2024-now out-of-sample
    start: '2024-01-01'
    end: null
filters:
  min_history_days: 252
  min_median_value_cr: 10
  min_price: 50
regime:
  mode: tighten
momentum:
  enabled: true
  min_dist_52w_high: 0.85
  min_atr_pct: 0.015
  max_atr_pct: 0.06
  max_ext_atr: 3.0
  max_ext_50dma: 0.2
  min_rs_63: 0.0
  require_ma_alignment: true
  bear_overrides:
    min_dist_52w_high: 0.9
    min_rs_63: 0.05
  stop_atr: 1.5
  target_r: 2.0
  weights:
    price_momentum: 0.2
    relative_strength: 0.15
    volume: 0.15
    structure: 0.15
    breakout: 0.1
    sector: 0.1
    fundamentals: 0.1
    catalyst: 0.05
reversal:
  enabled: true
  min_drawdown: 0.3
  low_age_min: 20
  low_age_max: 60
  higher_low_atr: 1.0
  min_support_days: 3
  support_band_atr: 1.0
  require_reclaim: true
  require_rs_divergence: true
  stop_basis: higher_low
  stop_atr_below_low: 0.5
  target_r: 2.5
  bear_overrides: {}
  weights:
    rs_divergence: 0.25
    reclaim: 0.2
    accumulation: 0.2
    higher_low: 0.15
    capitulation: 0.1
    sector: 0.1
controls:
  naive_low_within: 0.05
