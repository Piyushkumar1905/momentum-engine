name: Refresh site

# The only thing that ever runs. It executes the rules, commits JSON, and publishes
# flat files. Nothing serves requests.

on:
  schedule:
    # 12:00 UTC = 17:30 IST, Mon-Fri. NSE closes 15:30 IST; this leaves two hours for
    # the vendor's end-of-day data to settle. GitHub's scheduler can lag under load,
    # which is fine: the job is idempotent and the site stamps its own as-of date.
    - cron: "0 12 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "Rebuild the backtest too (slow; normally only needed when rules change)"
        type: boolean
        default: false

# Never let two refreshes race for the same commit.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write     # commit refreshed JSON, picks and universe snapshots
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Price history is ~36 MB and must NOT be committed. Restoring yesterday's cache
      # means each run fetches only the missing tail instead of ~500 full histories,
      # which is what keeps this inside the vendor's rate limits.
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Run the rules
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then
            python tools/export_site.py
          else
            python tools/export_site.py --daily
          fi

      - name: Commit refreshed output
        run: |
          git config user.name  "momentum-engine[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data output/picks_*.csv universe/snapshots
          if git diff --staged --quiet; then
            echo "Nothing changed (likely a market holiday) - skipping commit."
          else
            git commit -m "refresh: data as of $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
